<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobel</title>
</head>
<body>
    <canvas id="canvas"></canvas>
    <canvas id="resultado"></canvas>

    <script type="text/javascript">

        var image = new Image();
        image.onload = imageLoaded;
        image.src = "/src/Fuente_de_Cibeles.jpeg"; // asegúrate de que la imagen esté en la misma carpeta

        function imageLoaded() {
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext("2d");

            canvas.width = image.width;
            canvas.height = image.height;
            ctx.drawImage(image, 0, 0, image.width, image.height);

            blancoYNegro(canvas);

            var resultado = document.getElementById('resultado');
            convolucionar(canvas, resultado);
        }

        function blancoYNegro(canvas){
            var ctx = canvas.getContext("2d");
            var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var pixeles = imgData.data;
            
            for (var p = 0 ; p < pixeles.length; p +=4){
                var rojo = pixeles[p];
                var verde = pixeles[p + 1];
                var azul = pixeles[p + 2];

                var gris = (rojo + verde + azul)/3;
                
                pixeles[p] = gris;
                pixeles[p + 1] = gris;
                pixeles[p + 2] = gris;
            }

            ctx.putImageData(imgData, 0, 0);
        }
    </script>
</body>
</html>
